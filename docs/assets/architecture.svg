<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Architecture chart showing data and provenance flowing through FastAPI services to browser UI"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1117"/><stop offset=".55" stop-color="#102124"/><stop offset="1" stop-color="#081011"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#537f6f"/><stop offset=".5" stop-color="#29463f"/><stop offset="1" stop-color="#11221d"/></linearGradient><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#3f6f66" stroke-opacity=".13" stroke-width="1"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#8bc9b4" stroke-width="1.5"/></marker></defs><rect width="1280" height="480" fill="url(#bg)"/><rect width="1280" height="480" fill="url(#grid)"/><path d="M18 72V18H75 M1205 18h57v54 M18 408v54h57 M1205 462h57v-54" fill="none" stroke="#8bc9b4" stroke-width="3" opacity=".7"/><text x="64" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#8bc9b4" font-weight="700" text-anchor="start">REPRODUCIBLE FULL-STACK DESIGN</text><text x="64" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" fill="#f0f6f4" font-weight="750" text-anchor="start">System architecture</text><path d="M64 136 H1216" stroke="#38655b" opacity=".7"/><rect x="58" y="185" width="290" height="206" rx="14" fill="#101c21" stroke="#31534e" stroke-width="1.5"/><text x="78" y="221" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#8bc9b4" font-weight="750" text-anchor="start">SOURCE &amp; PROVENANCE</text><text x="79" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#f0f6f4" font-weight="500" text-anchor="start">• Mission product labels</text><text x="79" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#f0f6f4" font-weight="500" text-anchor="start">• Checksum + source catalogue</text><text x="79" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#f0f6f4" font-weight="500" text-anchor="start">• Prepared HiRISE DEM / masks</text><text x="79" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#f0f6f4" font-weight="500" text-anchor="start">• Observation coverage</text>
