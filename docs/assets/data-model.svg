<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="861" viewBox="0 0 1400 861" role="img" aria-label="MARSWALK logical data model">
<title>MARSWALK logical data model</title><desc>Conceptual entities Study Area, Data Layer, Source Product, Science Stop, Mission Plan, Route Leg and Environmental Observation with their key relationships.</desc>
