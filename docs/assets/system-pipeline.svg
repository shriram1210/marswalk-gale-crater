<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="490" viewBox="0 0 1280 490" role="img" aria-label="MARSWALK data pipeline from NASA sources to backend frontend and mission outputs"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1117"/><stop offset=".55" stop-color="#102124"/><stop offset="1" stop-color="#081011"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#537f6f"/><stop offset=".5" stop-color="#29463f"/><stop offset="1" stop-color="#11221d"/></linearGradient><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#3f6f66" stroke-opacity=".13" stroke-width="1"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#8bc9b4" stroke-width="1.5"/></marker></defs><rect width="1280" height="490" fill="url(#bg)"/><rect width="1280" height="490" fill="url(#grid)"/><path d="M18 72V18H75 M1205 18h57v54 M18 418v54h57 M1205 472h57v-54" fill="none" stroke="#8bc9b4" stroke-width="3" opacity=".7"/><text x="64" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#8bc9b4" font-weight="700" text-anchor="start">THE APPLICATION PIPELINE</text><text x="64" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" fill="#f0f6f4" font-weight="750" text-anchor="start">From NASA observations to mission plans</text><path d="M64 136 H1216" stroke="#38655b" opacity=".7"/><rect x="50" y="194" width="260" height="215" rx="17" fill="#142425" stroke="#3d6d61" stroke-width="1.5"/><text x="72" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#8bc9b4" font-weight="750" text-anchor="start">NASA SOURCES</text><text x="72" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• MRO HiRISE elevation</text><text x="72" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• Curiosity science views</text><text x="72" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• Archive labels &amp; provenance</text><path d="M316 303h28" stroke="#9bd2c0" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="354" y="194" width="260" height="215" rx="17" fill="#142425" stroke="#3d6d61" stroke-width="1.5"/><text x="376" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#8bc9b4" font-weight="750" text-anchor="start">DATA PREPARATION</text><text x="376" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• Mars CRS and masks</text><text x="376" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• Verified raster packages</text><text x="376" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• Coverage / resolution</text><path d="M620 303h28" stroke="#9bd2c0" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="658" y="194" width="260" height="215" rx="17" fill="#142425" stroke="#3d6d61" stroke-width="1.5"/><text x="680" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#8bc9b4" font-weight="750" text-anchor="start">FASTAPI ENGINE</text><text x="680" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• Terrain inspection</text><text x="680" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• A* route comparison</text><text x="680" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• Independent return leg</text><path d="M924 303h28" stroke="#9bd2c0" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="962" y="194" width="260" height="215" rx="17" fill="#142425" stroke="#3d6d61" stroke-width="1.5"/><text x="984" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#8bc9b4" font-weight="750" text-anchor="start">FRONTEND + OUTPUT</text><text x="984" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• 2D / 3D mapping</text><text x="984" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• Time and science context</text><text x="984" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#f0f6f4" font-weight="500" text-anchor="start">• JSON / printable reports</text><text x="640" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#a9c4be" font-weight="600" text-anchor="middle">Data are versioned and validated before route calculations or display.</text></svg>