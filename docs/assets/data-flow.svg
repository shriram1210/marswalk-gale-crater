<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="653" viewBox="0 0 1400 653" role="img" aria-label="Data flow diagram">
<title>Data flow diagram</title><desc>NASA source products are prepared and validated, used by FastAPI for terrain-aware route calculation, and shown in the browser with exportable mission results.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1418"/><stop offset=".55" stop-color="#101f21"/><stop offset="1" stop-color="#091114"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#77ad9f" stroke-opacity=".075"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#a1d6c5" stroke-width="1.8"/></marker></defs>
<rect width="1400" height="653" fill="url(#bg)"/><rect width="1400" height="653" fill="url(#grid)"/>
<text x="52" y="65" text-anchor="start" fill="#eef5f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">DATA FLOW  /  FROM EVIDENCE TO A MARSWALK</text><text x="52" y="105" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500">Data provenance remains attached to the prepared dataset and calculated results.</text><rect x="52" y="169" width="284" height="222" rx="16" fill="#132425" stroke="#436c63" stroke-width="1.6"/><text x="71" y="204" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">01</text><text x="71" y="242" text-anchor="start" fill="#eef5f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">NASA SOURCE PRODUCTS</text><text x="71" y="273" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">Observations &amp; records</text><text x="71" y="315" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• HiRISE stereo terrain</text><text x="71" y="340" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Curiosity scientific context</text><text x="71" y="365" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Instrument labels and IDs</text><rect x="389" y="169" width="284" height="222" rx="16" fill="#132425" stroke="#436c63" stroke-width="1.6"/><text x="408" y="204" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">02</text><text x="408" y="242" text-anchor="start" fill="#eef5f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">PREPROCESS &amp; VERIFY</text><text x="408" y="273" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">Offline preparation</text><text x="408" y="315" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Mars projection / coverage</text><text x="408" y="340" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Data masks and units</text><text x="408" y="365" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Checksums and manifests</text><rect x="726" y="169" width="284" height="222" rx="16" fill="#132425" stroke="#436c63" stroke-width="1.6"/><text x="745" y="204" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">03</text><text x="745" y="242" text-anchor="start" fill="#eef5f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">FASTAPI BACKEND</text><text x="745" y="273" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">Verified local computation</text><text x="745" y="315" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Terrain and science APIs</text><text x="745" y="340" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• A* routing and return</text><text x="745" y="365" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Time, slope, exclusions</text><rect x="1063" y="169" width="284" height="222" rx="16" fill="#132425" stroke="#436c63" stroke-width="1.6"/><text x="1082" y="204" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">04</text><text x="1082" y="242" text-anchor="start" fill="#eef5f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">MISSION INTERFACE</text><text x="1082" y="273" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">User exploration</text><text x="1082" y="315" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• 2D / 3D viewer</text><text x="1082" y="340" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Map picks and route inputs</text><text x="1082" y="365" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">• Profiles / JSON reports</text><path d="M339 281 H380" fill="none" stroke="#a1d6c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M676 281 H717" fill="none" stroke="#a1d6c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1013 281 H1054" fill="none" stroke="#a1d6c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="52" y="436" width="618" height="127" rx="16" fill="#172e2b" stroke="#436c63" stroke-width="1.6"/><text x="76" y="473" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">INPUT / SCIENCE QUESTIONS</text><text x="76" y="507" text-anchor="start" fill="#eef5f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500">Base • Ordered stops • Walking speed • Slope limit • Time budget</text><text x="76" y="534" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">Hypothetical assumptions are supplied by the user.</text><rect x="725" y="436" width="622" height="127" rx="16" fill="#172e2b" stroke="#436c63" stroke-width="1.6"/><text x="750" y="473" text-anchor="start" fill="#a1d6c5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">OUTPUT / MISSION REPORT</text><text x="750" y="507" text-anchor="start" fill="#eef5f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500">Two route modes • Return journey • Elevation profile • Warnings</text><text x="750" y="534" text-anchor="start" fill="#b0c8c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500">Results identify terrain version, units and limits.</text><path d="M670 500 H710" fill="none" stroke="#a1d6c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M868 391V426" fill="none" stroke="#a1d6c5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="700" y="609" text-anchor="middle" fill="#e7b99d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">Local HiRISE routing is distinct from simulated planet-wide context.</text>
</svg>