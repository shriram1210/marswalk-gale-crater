<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="495" viewBox="0 0 1280 495" role="img" aria-label="Map Plan Survive workflow adapted from the Team STRATUS presentation"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1117"/><stop offset=".55" stop-color="#102124"/><stop offset="1" stop-color="#081011"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#537f6f"/><stop offset=".5" stop-color="#29463f"/><stop offset="1" stop-color="#11221d"/></linearGradient><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#3f6f66" stroke-opacity=".13" stroke-width="1"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#8bc9b4" stroke-width="1.5"/></marker></defs><rect width="1280" height="495" fill="url(#bg)"/><rect width="1280" height="495" fill="url(#grid)"/><path d="M18 72V18H75 M1205 18h57v54 M18 423v54h57 M1205 477h57v-54" fill="none" stroke="#8bc9b4" stroke-width="3" opacity=".7"/><text x="64" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#8bc9b4" font-weight="700" text-anchor="start">THE EXPLORATION WORKFLOW</text><text x="64" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" fill="#f0f6f4" font-weight="750" text-anchor="start">Map  →  Plan  →  Survive</text><path d="M64 136 H1216" stroke="#38655b" opacity=".7"/><rect x="70" y="172" width="320" height="245" rx="20" fill="#122324" stroke="#3a665c" stroke-width="1.5"/><text x="94" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#8bc9b4" font-weight="800" text-anchor="start">01</text><text x="94" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" fill="#f0f6f4" font-weight="800" text-anchor="start">MAP</text><text x="94" y="291" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8bc9b4" font-weight="700" text-anchor="start">OBSERVE</text><text x="94" y="333" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Examine real local terrain</text><text x="94" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Inspect slope and coverage</text><text x="94" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Follow science evidence</text><path d="M410 293h60" stroke="#95cbbb" stroke-width="3" marker-end="url(#arrow)"/><rect x="479" y="172" width="320" height="245" rx="20" fill="#122324" stroke="#3a665c" stroke-width="1.5"/><text x="503" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#8bc9b4" font-weight="800" text-anchor="start">02</text><text x="503" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" fill="#f0f6f4" font-weight="800" text-anchor="start">PLAN</text><text x="503" y="291" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8bc9b4" font-weight="700" text-anchor="start">CALCULATE</text><text x="503" y="333" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Select hypothetical stops</text><text x="503" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Compare A* route modes</text><text x="503" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Account for the return leg</text><path d="M819 293h60" stroke="#95cbbb" stroke-width="3" marker-end="url(#arrow)"/><rect x="888" y="172" width="320" height="245" rx="20" fill="#122324" stroke="#3a665c" stroke-width="1.5"/><text x="912" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#8bc9b4" font-weight="800" text-anchor="start">03</text><text x="912" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" fill="#f0f6f4" font-weight="800" text-anchor="start">SURVIVE</text><text x="912" y="291" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8bc9b4" font-weight="700" text-anchor="start">REVIEW</text><text x="912" y="333" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Check scenario time limits</text><text x="912" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Explore historical context</text><text x="912" y="387" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="500" text-anchor="start">• Export mission assumptions</text><text x="640" y="459" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a9c4be" font-weight="600" text-anchor="middle">LOCAL MEASUREMENTS  ·  EXPLICIT LIMITATIONS  ·  HYPOTHETICAL CREW PLANNING</text></svg>